# Install as /etc/systemd/system/relay-pwa.service.d/v14.conf from an administrator session.
# Do not restart the controller running your implementation/recovery conversation.
[Service]
Delegate=yes
ProtectControlGroups=no
ReadWritePaths=/home/relay /sys/fs/cgroup/system.slice/relay-pwa.service
Environment=RELAY_CONTROLLER_STATE_DIR=/home/relay/.relay-v0/controller
TimeoutStopSec=300
